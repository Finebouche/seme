# Sème with Transmission already running on macOS (Docker Desktop).
# Enable Transmission Remote/RPC access, then set its credentials below.
# SEME_DOWNLOADS must be the same host directory Transmission writes to.
services:
  seme:
    build: .
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - SEME_DOWNLOADER_TYPE=transmission
      - SEME_TRANSMISSION_URL=http://host.docker.internal:9091/transmission/rpc
      - SEME_TRANSMISSION_USERNAME=${TRANSMISSION_USERNAME:-}
      - SEME_TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:-}
      - SEME_TRANSMISSION_LABEL=seme
      - SEME_TORRENTIO_ENABLED=true
      - SEME_TORRENTIO_URL=https://torrentio.strem.fun
      - SEME_CLEANUP_KEEP_FOREVER=true
      - SEME_SERVER_EXTERNAL_URL=http://localhost:8080
    volumes:
      - ./seme-config:/config
      - ${SEME_DOWNLOADS:?Set SEME_DOWNLOADS to your Transmission download directory}:/data:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
# In Sème Settings → Paths, map Transmission's absolute host download path
# (e.g. /Users/you/Downloads/Seme) to /data. Also map/mount the incomplete
# directory when Transmission stores partial files elsewhere.
# Transmission must accept RPC from Docker Desktop's host gateway;
# retain authentication and configure the RPC allowlist accordingly.
